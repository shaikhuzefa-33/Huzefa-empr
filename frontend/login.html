<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Employee Payroll Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="max-width: 440px; width: 100%; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25); overflow: hidden;">
    <div style="background: linear-gradient(135deg, #1e3a8a, #2563eb); padding: 32px 28px; text-align: center; color: white;">
      <div style="width: 52px; height: 52px; background: rgba(255, 255, 255, 0.2); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">
        EP
      </div>
      <h1 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">Sign In to EPMS</h1>
      <p style="font-size: 0.85rem; color: #bfdbfe;">Employee Payroll Management System</p>
    </div>

    <div style="padding: 28px;">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email or Username</label>
          <input type="text" id="login-email" class="form-control" placeholder="admin@epms-corp.com" required value="admin@epms-corp.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">Password</label>
            <a href="#" onclick="openForgotPasswordModal(event)" style="font-size: 0.78rem; color: #2563eb; text-decoration: none; font-weight: 600;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="Password@123">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px; margin-top: 10px;" id="login-btn">
          Sign In to Dashboard
        </button>
      </form>

      <!-- Quick Demo Login Buttons -->
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
        <p style="font-size: 0.78rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 10px; text-align: center;">
          Quick Role Preview (One-Click)
        </p>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="quickFill('admin@epms-corp.com', 'admin')" style="font-size: 0.75rem; justify-content: center;">
            Admin
          </button>
          <button class="btn btn-outline btn-sm" onclick="quickFill('hr@epms-corp.com', 'hr')" style="font-size: 0.75rem; justify-content: center;">
            HR Manager
          </button>
          <button class="btn btn-outline btn-sm" onclick="quickFill('huzefa@epms-corp.com', 'employee')" style="font-size: 0.75rem; justify-content: center;">
            Employee
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-password-modal">
    <div class="modal-dialog" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button class="modal-close" onclick="closeForgotPasswordModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 16px;">
          Enter your registered employee or work email address. We will dispatch verification instructions.
        </p>
        <div class="form-group">
          <label class="form-label">Registered Work Email</label>
          <input type="email" id="reset-email" class="form-control" placeholder="employee@epms-corp.com" value="huzefa@epms-corp.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeForgotPasswordModal()">Cancel</button>
        <button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Link</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/app.js"></script>
  <script>
    function quickFill(email, role) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'Password@123';
      EPMS.showToast(`Selected ${role.toUpperCase()} credentials`, 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (data.success) {
          EPMS.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        } else {
          EPMS.showToast(data.message || 'Login failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In to Dashboard';
        }
      } catch (err) {
        EPMS.showToast('Server connection error', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In to Dashboard';
      }
    }

    function openForgotPasswordModal(e) {
      e.preventDefault();
      document.getElementById('forgot-password-modal').classList.add('open');
    }

    function closeForgotPasswordModal() {
      document.getElementById('forgot-password-modal').classList.remove('open');
    }

    async function sendPasswordReset() {
      const email = document.getElementById('reset-email').value;
      if (!email) {
        EPMS.showToast('Please enter an email', 'error');
        return;
      }
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        closeForgotPasswordModal();
        EPMS.showToast(data.message, 'success');
      } catch (err) {
        EPMS.showToast('Failed to request reset', 'error');
      }
    }
  </script>
</body>
</html>
