<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management - Employee Payroll Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">EP</div>
        <div class="brand-text">
          <h2>EPMS Portal</h2>
          <span>Enterprise Payroll</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav-container"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" style="width: 100%; color: #cbd5e1; border-color: rgba(255,255,255,0.15);" onclick="EPMS.logout()">
          Sign Out
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">Leave Management & Approvals</h1>
        </div>
        <div class="topbar-right">
          <div class="role-switcher-badge" id="user-role-badge"></div>
          <div class="user-profile-badge" id="user-profile-widget" onclick="window.location.href='settings.html'"></div>
        </div>
      </header>

      <main class="content-body">
        <!-- Leave Balances Cards -->
        <h3 style="font-size:0.9rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">
          Available Leave Entitlements (2026)
        </h3>
        <div class="stats-grid" id="leave-balances-grid" style="margin-bottom:24px;">
          <!-- Populated dynamically -->
        </div>

        <!-- Action Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2 style="font-size:1.1rem; font-weight:700; color:var(--dark);">Leave Applications & History</h2>
          <button class="btn btn-primary" onclick="openApplyLeaveModal()">
            <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Apply for Leave
          </button>
        </div>

        <!-- Leave Requests Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Leave Type</th>
                  <th>Duration (Dates)</th>
                  <th>Days</th>
                  <th>Reason</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="leaves-tbody">
                <tr><td colspan="7" style="text-align:center; padding:20px;">Loading leave requests...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Apply Leave Modal -->
  <div class="modal-overlay" id="apply-leave-modal">
    <div class="modal-dialog" style="max-width:520px;">
      <div class="modal-header">
        <h3 class="modal-title">Submit Leave Request</h3>
        <button class="modal-close" onclick="EPMS.closeModal('apply-leave-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="leave-form" onsubmit="submitLeave(event)">
          <div class="form-group">
            <label class="form-label">Leave Type *</label>
            <select id="leave-type-select" class="form-control" required></select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Start Date *</label>
              <input type="date" id="leave-start" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">End Date *</label>
              <input type="date" id="leave-end" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Total Days Requested *</label>
            <input type="number" step="0.5" id="leave-days" class="form-control" value="1" required min="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">Reason for Absence *</label>
            <textarea id="leave-reason" class="form-control" rows="3" placeholder="Explain the context or reason for leave..." required></textarea>
          </div>
          <div class="modal-footer" style="padding:16px 0 0 0; background:none;">
            <button type="button" class="btn btn-outline" onclick="EPMS.closeModal('apply-leave-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Submit Application</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script>
    let leaveTypes = [];

    async function loadData() {
      try {
        const [leavesRes, balancesRes] = await Promise.all([
          fetch('/api/leaves'),
          fetch('/api/leaves/balances'),
        ]);
        const leavesData = await leavesRes.json();
        const balancesData = await balancesRes.json();

        if (balancesData.success) {
          renderBalances(balancesData.balances);
        }
        if (leavesData.success) {
          leaveTypes = leavesData.leave_types;
          populateLeaveTypes();
          renderLeaves(leavesData.leaves);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderBalances(balances) {
      const grid = document.getElementById('leave-balances-grid');
      grid.innerHTML = balances.map(b => `
        <div class="stat-card" style="padding:16px;">
          <div>
            <span style="font-size:0.75rem;">${b.leave_name}</span>
            <h3 style="font-size:1.5rem; margin-top:2px; color:#1e3a8a;">${b.remaining_days} <small style="font-size:0.8rem; color:#64748b;">/ ${b.allocated_days} days</small></h3>
            <div style="font-size:0.75rem; color:#059669; font-weight:600; margin-top:4px;">${b.used_days} used this year</div>
          </div>
        </div>
      `).join('');
    }

    function populateLeaveTypes() {
      const select = document.getElementById('leave-type-select');
      select.innerHTML = leaveTypes.map(t => `<option value="${t.id}">${t.leave_name} (${t.is_paid ? 'Paid' : 'Unpaid'})</option>`).join('');
    }

    function renderLeaves(leaves) {
      const tbody = document.getElementById('leaves-tbody');
      const isPrivileged = EPMS.currentUser && (EPMS.currentUser.role === 'admin' || EPMS.currentUser.role === 'hr');

      if (leaves.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-muted);">No leave applications found.</td></tr>`;
        return;
      }

      tbody.innerHTML = leaves.map(l => {
        let badgeClass = 'badge-warning';
        if (l.status === 'Approved') badgeClass = 'badge-success';
        if (l.status === 'Rejected') badgeClass = 'badge-danger';

        let actions = '—';
        if (l.status === 'Pending' && isPrivileged) {
          actions = `
            <div style="display:flex; gap:6px;">
              <button class="btn btn-success btn-sm" onclick="approveLeave(${l.id})">Approve</button>
              <button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="rejectLeave(${l.id})">Reject</button>
            </div>
          `;
        }

        return `
          <tr>
            <td>
              <div style="font-weight:600; color:var(--dark);">${l.employee_name}</div>
              <div style="font-size:0.75rem; color:var(--text-muted); font-family:monospace;">${l.employee_code}</div>
            </td>
            <td><span class="badge badge-info">${l.leave_name}</span></td>
            <td style="font-size:0.85rem;">${l.start_date} <span style="color:#64748b;">to</span> ${l.end_date}</td>
            <td style="font-weight:700;">${l.days_count} d</td>
            <td style="font-size:0.85rem; max-width:220px;">${l.reason}</td>
            <td><span class="badge ${badgeClass}">${l.status}</span></td>
            <td>${actions}</td>
          </tr>
        `;
      }).join('');
    }

    function openApplyLeaveModal() {
      document.getElementById('leave-form').reset();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('leave-start').value = today;
      document.getElementById('leave-end').value = today;
      EPMS.openModal('apply-leave-modal');
    }

    async function submitLeave(e) {
      e.preventDefault();
      const payload = {
        leave_type_id: document.getElementById('leave-type-select').value,
        start_date: document.getElementById('leave-start').value,
        end_date: document.getElementById('leave-end').value,
        days_count: Number(document.getElementById('leave-days').value),
        reason: document.getElementById('leave-reason').value,
      };

      try {
        const res = await fetch('/api/leaves/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.success) {
          EPMS.closeModal('apply-leave-modal');
          EPMS.showToast('Leave application submitted for approval', 'success');
          loadData();
        } else {
          EPMS.showToast(data.message, 'error');
        }
      } catch (err) {
        EPMS.showToast('Submission failed', 'error');
      }
    }

    async function approveLeave(id) {
      try {
        const res = await fetch(`/api/leaves/${id}/approve`, { method: 'PUT' });
        const data = await res.json();
        if (data.success) {
          EPMS.showToast('Leave request approved', 'success');
          loadData();
        }
      } catch (err) {
        EPMS.showToast('Failed to approve', 'error');
      }
    }

    async function rejectLeave(id) {
      const reason = prompt('Please enter rejection reason:');
      if (!reason) return;
      try {
        const res = await fetch(`/api/leaves/${id}/reject`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rejection_reason: reason }),
        });
        const data = await res.json();
        if (data.success) {
          EPMS.showToast('Leave request rejected', 'info');
          loadData();
        }
      } catch (err) {
        EPMS.showToast('Failed to reject', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
